services:
  - type: web
    name: devour-routing
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SHARED_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        value: https://devour-routing.onrender.com/callback
      - key: BOT_URL
        value: https://cufflink-fall-outbid.ngrok-free.dev
